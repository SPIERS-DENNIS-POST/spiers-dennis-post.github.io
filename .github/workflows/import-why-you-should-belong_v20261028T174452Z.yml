name: Import Why You Should Belong PDF
on:
  push:
    paths:
      - ".github/workflows/import-why-you-should-belong_v20261028T174452Z.yml"
permissions:
  contents: write
jobs:
  import-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import official brochure and update the membership link
        run: |
          set -euo pipefail
          mkdir -p assets/documents
          curl -fL --retry 3 --retry-delay 2 -o 'assets/documents/Why You Should Belong.pdf' 'https://www.legion.org/getmedia/427180d4-ca0d-411d-b365-fc4b06b8818e/54mem1225-why-you-should-belong.pdf'
          echo '51fe9bf57fd6fcd453013f2279c9e8c4012e87fad8724238bcdbb5796a2bb48c  assets/documents/Why You Should Belong.pdf' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p = Path('membership/index.md')
          content = p.read_text()
          old = '<p><a href="https://www.legion.org/information-center/in-the-media/publications/organization-membership-awards" aria-label="Why join the American Legion? Find the National Why You Should Belong brochure under Membership">Why?</a></p>'
          new = '<p><a href="{{ \'/assets/documents/Why%20You%20Should%20Belong.pdf\' | relative_url }}" aria-label="Why join the American Legion? Read Why You Should Belong (PDF)">Why?</a></p>'
          if content.count(old) != 1: raise SystemExit('Expected Why? link not found exactly once')
          p.write_text(content.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- membership/index.md 'assets/documents/Why You Should Belong.pdf'
          git commit -m 'Self-host Why You Should Belong brochure'
          git push
