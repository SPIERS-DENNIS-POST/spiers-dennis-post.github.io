name: Restore Post Home original PNGs
on:
  push:
    paths:
      - .github/png-import/**
permissions:
  contents: write
jobs:
  restore:
    if: github.repository == 'SPIERS-DENNIS-POST/spiers-dennis-post.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify original photos
        shell: bash
        run: |
          set -euo pipefail
          for name in post-home-west-entrance-doors post-home-west-entrance-awning post-home-south-5th-facade post-home-building-front; do
            cat .github/png-import/"${name}".b64.* | base64 --decode > "assets/images/${name}.png"
          done
          printf '%s\n' '13a013acb3f22eb5e5cdca2bf997dc391a8c7edaa232f876c51008940ce2cdb5  assets/images/post-home-west-entrance-doors.png' 'a952d109eab41fa4a5cf2f749942aed69c52014b04139f26bc5b30a14c5f521d  assets/images/post-home-west-entrance-awning.png' 'af3ab22e16e5b18bb74b67cb7571a88e6d0684cd0724f4b2e7f51d58455fa958  assets/images/post-home-south-5th-facade.png' 'a5969c48124b6e1925b5b88253c4d38676abbdc74afe2951f7ba71a0115e4954  assets/images/post-home-building-front.png' | sha256sum --check --status
          git rm -- assets/images/post-home-west-entrance-doors.webp assets/images/post-home-west-entrance-awning.webp assets/images/post-home-south-5th-facade.webp assets/images/post-home-building-front.webp
          git rm -r -- .github/png-import
          git rm -- .github/workflows/restore-post-home-pngs.yml
          git add -- assets/images/post-home-west-entrance-doors.png assets/images/post-home-west-entrance-awning.png assets/images/post-home-south-5th-facade.png assets/images/post-home-building-front.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore original Post Home PNG photos and remove WebP versions'
          git push origin HEAD:main
