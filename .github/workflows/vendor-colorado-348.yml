name: Vendor Colorado Highway 348 SVG
on:
  push:
    paths:
      - ".github/workflows/vendor-colorado-348.yml"
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit original SVG
        run: |
          curl -fLsS --retry 3 "https://upload.wikimedia.org/wikipedia/commons/8/8a/Colorado_348_wide.svg" -o assets/images/colorado-348-wide.svg
          python -c 'import xml.etree.ElementTree as ET;ET.parse("assets/images/colorado-348-wide.svg")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/colorado-348-wide.svg
          git commit -m "Vendor Colorado Highway 348 SVG"
          git push
