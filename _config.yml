title: Spiers-Dennis Post No. 24
description: American Legion Post 24 in Olathe, Colorado. Find Post contact information, officers, history, membership and meeting information.
url: https://spiers-dennis-post.github.io
baseurl: ""
lang: en
markdown: kramdown
permalink: pretty
collections:
  news:
    output: true
    permalink: /news/:name/
  letters:
    output: true
    permalink: /commanders-letters/:name/
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: ""
      type: news
    values:
      layout: publication
  - scope:
      path: ""
      type: letters
    values:
      layout: publication
plugins:
  - jekyll-redirect-from
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
