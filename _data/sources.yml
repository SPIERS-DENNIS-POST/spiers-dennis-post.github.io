- id: naval-historical-foundation-cyclops
  title: Naval Historical Foundation — The Unanswered Loss of USS Cyclops, March 1918
  url: https://navyhistory.org/2013/06/unanswered-loss-uss-cyclops-march-1918/
  details: June 13, 2013 account by Capt. Lawrence B. Brennan, USN (Ret.), reporting 10,800 long tons of manganese ore, a cracked starboard engine cylinder, the March 4 Barbados departure, and plausible but unproven contributing factors.
  published_on: 2013-06-13
- id: navy-lost-all-hands-1918
  title: Naval History and Heritage Command — Lost With All Hands, USS Cyclops (1918)
  url: https://www.history.navy.mil/content/history/nhhc/about-us/leadership/director/directors-corner/h-grams/h-gram-060/h-060-2.html
  details: Official Navy historical account of the loss of all 306 people aboard USS Cyclops after leaving Barbados on March 4, 1918; notes discrepancies in reported headcounts, the absence of recovered wreckage, and no evidence of enemy action.
- id: veirs-olathe-mills
