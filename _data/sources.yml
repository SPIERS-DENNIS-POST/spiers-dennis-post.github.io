- id: post-officer-roster-2026-10-27
  title: Spiers-Dennis Post No. 24 — officer roster
  details: Officer assignments confirmed by Post Commander Samuel A. Mebane on October 27, 2026, with Jimmy W Davidson's 2016 installation, Past District Commander distinction, and Sergeant at Arms William Maness provided in a subsequent Post roster update on the same date.
  published_on: 2026-10-27
- id: post-december-meeting-vote-2026-10-27
  title: Spiers-Dennis Post No. 24 — December 2026 meeting vote
  details: At the October 27, 2026 regular Post meeting, members voted to hold the December 2026 meeting despite the customary holiday cancellation. The ordinary fourth-Tuesday date falls on December 22, 2026. No permanent policy change for later Decembers was specified.
  published_on: 2026-10-27
- id: post-meetings-2026-10-27
  title: Spiers-Dennis Post No. 24 — meeting schedule
  details: Fourth-Tuesday meetings at 5:30 p.m., dinner at 5:00 p.m., and the usual December cancellation confirmed by the Post Commander on October 27, 2026.
  published_on: 2026-10-27
- id: post-facilities-traditions-2026-10-27
  title: Spiers-Dennis Post No. 24 — Post hall and annual traditions
  details: Post-provided information confirmed October 27, 2026. The hall has no bar and does not sell alcohol. For Memorial Day, members place flags at Olathe, Pea Green, and Ash Mesa cemeteries; for Veterans Day the Post attends the OMHS Veterans Day Assembly in the middle school gym; and for Thanksgiving members and families traditionally gather for dinner at the Post.
  published_on: 2026-10-27
- id: post-weekly-gatherings-2026-10-27
  title: Spiers-Dennis Post No. 24 — weekly gathering schedule
  details: Post-provided information on Monday coffee from 7:00 a.m. to approximately 10:00 a.m., started by James Smith, USMC, and a Thursday PTSD Group from 1:00 to 3:00 p.m., conducted at the Post hall by a Vet Center counselor.
  published_on: 2026-10-27
