- id: navy-cyclops-assessment
  title: Naval History and Heritage Command — USS Cyclops, H-016-4
  url: https://www.history.navy.mil/about-us/leadership/director/directors-corner/h-grams/h-gram-016/h-016-4.html
  details: Official Navy historical assessment of Cyclops (AC-4), manganese cargo, machinery and structural concerns, and the undetermined cause of the disappearance.
- id: naval-historical-foundation-cyclops
  title: Naval Historical Foundation — The Unanswered Loss of USS Cyclops, March 1918
  url: https://navyhistory.org/2013/06/unanswered-loss-uss-cyclops-march-1918/
  details: June 13, 2013 account by Capt. Lawrence B. Brennan, USN (Ret.), reporting 10,800 long tons of manganese ore, a cracked starboard engine cylinder, the March 4 Barbados departure, and plausible but unproven contributing factors.
  published_on: 2013-06-13
- id: navy-lost-all-hands-1918
  title: Naval History and Heritage Command — Lost With All Hands, USS Cyclops (1918)
  url: https://www.history.navy.mil/content/history/nhhc/about-us/leadership/director/directors-corner/h-grams/h-gram-060/h-060-2.html
  details: Official Navy historical account of the loss of all 306 people aboard USS Cyclops after leaving Barbados on March 4, 1918; notes discrepancies in reported headcounts, the absence of recovered wreckage, and no evidence of enemy action.
- id: veirs-olathe-mills
  title: Lawrence N. Veirs — Bits and Pieces of Olathe History, index
  details: The index identifies R. P. (Bob) Mills and references R. P. Mills & Co. The historical genealogy website's former PDF link is no longer available, so the public citation is bibliographic rather than a dead link.
- id: usni-cyclops-weather-1970
  title: U.S. Naval Institute Proceedings — Comment and Discussion, January 1970
  url: https://www.usni.org/magazines/proceedings/1970/january/comment-and-discussion
  details: Retrospective examination of March 1918 weather reports identifying a front across Cyclops's estimated position on March 8 and the severe March 9–10 gale encountered by the freighter Amalco. Does not establish Cyclops's actual position or cause of loss.
  published_on: 1970-01-01
